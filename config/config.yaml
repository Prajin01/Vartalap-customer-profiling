# Single source of truth for paths and modelling parameters.
project:
  name: vartalap-customer-profiling
  random_seed: 42

paths:
  raw_xlsx: data/raw/online_retail_II.xlsx
  interim_parquet: data/interim/transactions.parquet
  duckdb: data/warehouse.duckdb
  reports_dir: reports
  models_dir: models

# SQL files, in execution order
sql:
  staging: sql/01_staging.sql
  data_quality: sql/02_data_quality.sql
  core: sql/03_core_model.sql
  core_summary: sql/checks/core_summary.sql
  features: sql/04_features_macro.sql
  labels: sql/05_labels_macro.sql

# Prediction design (Step 4 onward).
#   population : customers with >=1 purchase in the 365 days before a cutoff
#   features   : invoice_date <  cutoff
#   label      : >=1 purchase with cutoff <= invoice_date < cutoff + horizon_days
#   train      : stacked monthly cutoffs (includes Q4-2010 label windows)
#   valid/test : single later cutoffs; every train label window ends before valid,
#                and the valid label window ends before test.
modelling:
  horizon_days: 90
  active_lookback_days: 365
  train_cutoff_first: "2010-06-01"
  train_cutoff_last: "2011-03-01"
  valid_cutoff: "2011-06-01"
  test_cutoff: "2011-09-01"

# Step 6 - purchase-propensity model.
propensity:
  # Calendar feature = share of the label window's days that fall in these months.
  # Known at the cutoff (it is only the calendar), so it is not leakage.
  # Sep-Nov chosen from TRAIN label windows only: the Sep-2010 window (Sep-Nov) had the
  # highest positive rate (58%); windows containing December were lower because the
  # retailer shuts down over Christmas. Change to [10, 11, 12] to test the alternative.
  peak_months: [9, 10, 11]
  lgbm_grid:
    num_leaves: [15, 31, 63]
    min_child_samples: [50, 200]
  learning_rate: 0.03
  early_stopping_rounds: 100
  logreg_C: [0.01, 0.1, 1.0]
  # LightGBM is kept only if it beats logistic regression on VALID ROC-AUC by this margin;
  # otherwise the simpler, fully interpretable model is used.
  min_auc_gain_for_trees: 0.005
  # Post-hoc (Platt) calibration is applied only if it lowers the 5-fold cross-validated
  # Brier score on VALID by at least this much.
  min_brier_gain_for_calibration: 0.002
  top_fraction: 0.20
  bootstrap_reps: 500

# Step 5. Leave method/k empty for the automatic, metric-based choice; set them (and names)
# to fix the final solution after reviewing reports/segmentation.md.
segmentation:
  method: kmeans
  k: 5
  names:
    0: Low-spend occasional buyers
    1: Recent seasonal buyers
    2: Core high-value repeat accounts
    3: Lapsed buyers
    4: High-cancellation accounts
